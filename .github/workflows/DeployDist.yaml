name: Deploy distribution
on: push
#on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test code
        uses: actions/checkout@v6
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check node version
        run: node -v
      - name: Install dependencies
        run: npm install
      - name: Test code
        run: npm run test
      - name: Completed job
        run: echo "Test job was completed"
