name: Deploy distribution
on: push
#on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test project
        uses: actions/checkout@v6
      - name: Setup NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check node version
        run: node -v
      - name: Install dependencies
        run: npm install
      - name: Test code
        run: npm run test
      - name: Completed job
        run: echo "Test job was completed"
  build:
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Build project
        uses: actions/checkout@v6
      - name: Setup NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check node version
        run: node -v
      - name: Install dependencies
        run: npm install
      - name: Build code
        run: npm run build
      - name: Completed job
        run: echo "Build job was completed"
  deploy:
    needs:
      - test
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy project
        run: echo "Deploying project to npm registry"
